<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>preview</title>
<style>
  :root { --primary-color:#1a95e0; --secondary-color:#727578; --font-color:#151515; }
  body { background:#fff; color:var(--font-color); font-family:Menlo,Monaco,Consolas,monospace; padding:2rem; max-width:760px; margin:0 auto; }
  button { margin-bottom:1.5rem; }
  h1 { font-size:1.3rem; margin:1.4rem 0 0; }
  h1::after { content:""; display:block; border-bottom:2px solid var(--font-color); width:7ch; margin-top:.1rem; }
  .dark { background:#222225; --primary-color:#62c4ff; --secondary-color:#a3abba; --font-color:#e8e9ed; color:var(--font-color); }
</style></head>
<body>
<button onclick="document.body.classList.toggle('dark')">toggle dark</button>

<h1>About</h1>
<div class="home-hero" id="home-hero">
    <pre class="home-hero-screen" aria-hidden="true"></pre>
</div>

<h1>Latest posts</h1>
<p style="color:var(--secondary-color)">Feb 5, 2026 — Hello World</p>

<div class="footer" style="margin-top:2rem;border-top:1px solid var(--secondary-color);padding-top:1rem;">
    2026 &copy; Bdathe <span class="cursor">_</span>
    <span class="footer-shell-hint" role="button" tabindex="0">press <kbd>Ctrl</kbd>+<kbd>K</kbd> for shell</span>
</div>

<style>
.home-hero { margin:0.2rem 0 1.4rem; }
.home-hero-screen { margin:0; padding:0; background:transparent; border:0; font-size:1rem; line-height:1.7; white-space:pre-wrap; min-height:3.4em; }
.home-hero-line { display:block; }
.home-hero-prompt { color:var(--primary-color); font-weight:bold; }
.home-hero-line--done .home-hero-prompt { color:var(--secondary-color); font-weight:normal; }
.home-hero-out { color:var(--font-color); }
.home-hero-cursor { display:inline-block; margin-left:1px; color:var(--primary-color); animation:heroBlink 1s step-end infinite; }
@keyframes heroBlink { 50% { opacity:0; } }
.cursor { animation:heroBlink 1s step-end infinite; }
.footer-shell-hint { margin-left:.9rem; color:var(--secondary-color); font-size:.78rem; opacity:.65; cursor:pointer; }
.footer-shell-hint:hover { opacity:1; color:var(--primary-color); }
.footer-shell-hint kbd { padding:.05rem .35rem; border:1px solid var(--secondary-color); border-radius:3px; font-size:.72rem; }
</style>
<script>
(function () {
    var screen = document.querySelector('.home-hero-screen');
    if (!screen) return;
    var steps = [
        { cmd: 'whoami', out: 'Bdathe — CS grad student · UAV task allocation & path planning' },
        { cmd: 'echo $MOTTO', out: 'What I cannot create, I do not understand.' }
    ];
    var lines=[], step=0, typeSpeed=55, outDelay=450, nextDelay=1100;
    function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function render(typing){var h=lines.join('');h+='<span class="home-hero-line"><span class="home-hero-prompt">~$</span> <span>'+escapeHtml(typing)+'</span><span class="home-hero-cursor">_</span></span>';screen.innerHTML=h;}
    function typeCmd(){if(step>=steps.length){render('');return;}var cmd=steps[step].cmd,i=0;(function tick(){render(cmd.slice(0,i));if(i<cmd.length){i++;setTimeout(tick,typeSpeed);}else{setTimeout(showOut,outDelay);}})();}
    function showOut(){var s=steps[step];lines.push('<span class="home-hero-line home-hero-line--done"><span class="home-hero-prompt">~$</span> '+escapeHtml(s.cmd)+'</span>');lines.push('<span class="home-hero-line home-hero-out">'+escapeHtml(s.out)+'</span>');step++;render('');setTimeout(typeCmd,nextDelay);}
    render(''); setTimeout(typeCmd,500);
})();
</script>
</body></html>
