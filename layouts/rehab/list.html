{{ define "main" }}
<h1>{{ .Page.Title }}</h1>

{{ .Content }}

<style>
/* Calendar Styles matching hugo-theme-console */
.calendar-container {
    margin-top: 2rem;
    border: 1px dashed var(--secondary-color);
    padding: 1rem;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    font-weight: bold;
}

.calendar-btn {
    background: none;
    border: 1px solid var(--secondary-color);
    color: var(--font-color);
    cursor: pointer;
    padding: 0.2rem 0.5rem;
    font-family: inherit;
    transition: all 0.2s;
}
.calendar-btn:hover {
    color: var(--primary-color);
    border-color: var(--primary-color);
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.5rem;
    text-align: center;
}

.calendar-day-name {
    color: var(--secondary-color);
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
}

.calendar-day {
    padding: 0.5rem;
    border: 1px solid transparent;
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
}

.calendar-day:hover {
    border: 1px dashed var(--primary-color);
}

.calendar-day.empty {
    cursor: default;
}
.calendar-day.empty:hover {
    border-color: transparent;
}

.calendar-day.has-data {
    color: var(--primary-color);
    font-weight: bold;
    border-bottom: 2px solid var(--primary-color);
}

.calendar-day.active {
    background-color: var(--primary-color);
    color: var(--bg-color);
}
.calendar-day.active.has-data {
    border-bottom-color: var(--bg-color);
}

/* Detail Card Styles */
.rehab-card {
    margin-top: 2rem;
    padding: 1.5rem;
    border: 1px solid var(--primary-color);
    display: none; /* Hidden by default */
}

.rehab-card.show {
    display: block;
    animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

.card-date {
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--primary-color);
    margin-bottom: 1.5rem;
    border-bottom: 1px dashed var(--secondary-color);
    padding-bottom: 0.5rem;
}

.card-section {
    margin-bottom: 1.2rem;
}

.card-section h3 {
    font-size: 1rem;
    color: var(--secondary-color);
    margin: 0 0 0.5rem 0;
}

.card-section p, .card-section ul {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.6;
}
.card-section ul {
    padding-left: 1.5rem;
}
#cardExercises li {
    white-space: pre-wrap;
    margin-bottom: 0.5rem;
}
.pain-score {
    display: inline-block;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    font-size: 0.8rem;
    margin-left: 0.5rem;
    background-color: var(--error-color);
    color: var(--background-color);
}
</style>

<div class="calendar-container">
    <div class="calendar-header">
        <button class="calendar-btn" id="prevMonth">&lt; Prev</button>
        <div id="currentMonthYear">Loading...</div>
        <button class="calendar-btn" id="nextMonth">Next &gt;</button>
    </div>
    <div class="calendar-grid" id="calendarGrid">
        <!-- Days will be generated by JS -->
    </div>
</div>

<div class="rehab-card" id="rehabDetailCard">
    <div class="card-date" id="cardDate"></div>
    
    <div class="card-section" id="sectionMorning" style="display:none;">
        <h3>🌅 晨间状态</h3>
        <p><span id="cardMorning"></span> <span id="cardMorningScore" class="pain-score"></span></p>
    </div>
    
    <div class="card-section" id="sectionEvening" style="display:none;">
        <h3>🌙 夜间总结</h3>
        <p><span id="cardEvening"></span> <span id="cardEveningScore" class="pain-score"></span></p>
    </div>
    
    <div class="card-section" id="sectionExercises" style="display:none;">
        <h3>🏃 今日训练</h3>
        <ul id="cardExercises"></ul>
    </div>
    
    <div class="card-section" id="sectionFeedback" style="display:none;">
        <h3>💡 训练反馈</h3>
        <p id="cardFeedback"></p>
    </div>
    
    <div class="card-section" id="sectionNote" style="display:none;">
        <h3>📌 备注</h3>
        <p id="cardNote" style="color: var(--secondary-color); font-style: italic;"></p>
    </div>
</div>

<script>
    // 1. Load Data from Hugo
    const rawData = {{ .Site.Data.rehab | jsonify }};
    const rehabData = (rawData !== null && rawData !== "null") ? JSON.parse(rawData) : [];
    
    // Create a map for quick lookup: 'YYYY-MM-DD' -> record
    const dataMap = {};
    if (Array.isArray(rehabData)) {
        rehabData.forEach(record => {
            dataMap[record.date] = record;
        });
    }

    // 2. Calendar Logic
    let currentDate = new Date(); 
    
    // If there is data, set current date to the latest entry's month
    if (Array.isArray(rehabData) && rehabData.length > 0) {
        // Sort to get latest
        const sortedData = [...rehabData].sort((a, b) => new Date(b.date) - new Date(a.date));
        const latestStr = sortedData[0].date;
        const [y, m, d] = latestStr.split('-');
        currentDate = new Date(parseInt(y), parseInt(m) - 1, 1);
    } else {
        // Fallback to actual current date if no data
        const now = new Date();
        currentDate = new Date(now.getFullYear(), now.getMonth(), 1);
    }

    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    const calendarGrid = document.getElementById('calendarGrid');
    const currentMonthYearDisplay = document.getElementById('currentMonthYear');
    const detailCard = document.getElementById('rehabDetailCard');

    function renderCalendar() {
        calendarGrid.innerHTML = '';
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        currentMonthYearDisplay.textContent = `${year}年 ${month + 1}月`;

        // Add day headers
        dayNames.forEach(day => {
            const div = document.createElement('div');
            div.className = 'calendar-day-name';
            div.textContent = day;
            calendarGrid.appendChild(div);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Empty cells before first day
        for (let i = 0; i < firstDay; i++) {
            const div = document.createElement('div');
            div.className = 'calendar-day empty';
            calendarGrid.appendChild(div);
        }

        // Days of the month
        for (let i = 1; i <= daysInMonth; i++) {
            const div = document.createElement('div');
            div.className = 'calendar-day';
            div.textContent = i;
            
            // Format date string as YYYY-MM-DD
            const monthStr = String(month + 1).padStart(2, '0');
            const dayStr = String(i).padStart(2, '0');
            const dateString = `${year}-${monthStr}-${dayStr}`;
            
            div.dataset.date = dateString;

            if (dataMap[dateString]) {
                div.classList.add('has-data');
            }

            div.addEventListener('click', () => handleDayClick(div, dateString));
            
            calendarGrid.appendChild(div);
        }
    }

    let activeDayElement = null;

    function handleDayClick(dayElement, dateString) {
        if (activeDayElement) {
            activeDayElement.classList.remove('active');
        }
        dayElement.classList.add('active');
        activeDayElement = dayElement;

        const record = dataMap[dateString];
        if (record) {
            showDetailCard(record);
        } else {
            // Show an "empty" state
            document.getElementById('cardDate').textContent = dateString;
            document.getElementById('cardFeedback').textContent = "今日无打卡记录。";
            
            document.getElementById('sectionMorning').style.display = 'none';
            document.getElementById('sectionEvening').style.display = 'none';
            document.getElementById('sectionExercises').style.display = 'none';
            document.getElementById('sectionNote').style.display = 'none';
            
            const secFeed = document.getElementById('sectionFeedback');
            secFeed.style.display = 'block';
            
            detailCard.classList.add('show');
        }
    }

    function showDetailCard(record) {
        document.getElementById('cardDate').textContent = record.date;
        
        // Morning
        const secMorn = document.getElementById('sectionMorning');
        if (record.morning_status) {
            document.getElementById('cardMorning').textContent = record.morning_status;
            const score = record.morning_pain_score ? `疼痛: ${record.morning_pain_score}/10` : '';
            document.getElementById('cardMorningScore').textContent = score;
            secMorn.style.display = 'block';
        } else {
            secMorn.style.display = 'none';
        }

        // Evening
        const secEve = document.getElementById('sectionEvening');
        if (record.evening_status) {
            document.getElementById('cardEvening').textContent = record.evening_status;
            const score = record.evening_pain_score ? `疼痛: ${record.evening_pain_score}/10` : '';
            document.getElementById('cardEveningScore').textContent = score;
            secEve.style.display = 'block';
        } else {
            secEve.style.display = 'none';
        }

        // Exercises
        const secExe = document.getElementById('sectionExercises');
        const listExe = document.getElementById('cardExercises');
        listExe.innerHTML = '';
        if (record.exercises && record.exercises.length > 0) {
            record.exercises.forEach(exe => {
                const li = document.createElement('li');
                if (typeof exe === 'object' && exe !== null) {
                    // Handle nested lists if user adds colons (e.g. - 中午: \n  - 动作1)
                    let text = '';
                    for (const [key, value] of Object.entries(exe)) {
                        text += key + ':\n';
                        if (Array.isArray(value)) {
                            value.forEach(v => text += '  - ' + v + '\n');
                        } else {
                            text += '  - ' + value + '\n';
                        }
                    }
                    li.textContent = text.trim();
                } else {
                    // Handle multiline strings
                    li.textContent = exe;
                }
                listExe.appendChild(li);
            });
            secExe.style.display = 'block';
        } else {
            secExe.style.display = 'none';
        }

        // Feedback
        const secFeed = document.getElementById('sectionFeedback');
        if (record.feedback) {
            document.getElementById('cardFeedback').textContent = record.feedback;
            secFeed.style.display = 'block';
        } else {
            secFeed.style.display = 'none';
        }

        // Note
        const secNote = document.getElementById('sectionNote');
        if (record.note) {
            document.getElementById('cardNote').textContent = record.note;
            secNote.style.display = 'block';
        } else {
            secNote.style.display = 'none';
        }

        detailCard.classList.add('show');
    }

    // Navigation
    document.getElementById('prevMonth').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        detailCard.classList.remove('show');
        if(activeDayElement) activeDayElement.classList.remove('active');
        renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        detailCard.classList.remove('show');
        if(activeDayElement) activeDayElement.classList.remove('active');
        renderCalendar();
    });

    // Initial Render
    renderCalendar();
</script>
{{ end }}
