{{ define "main" }}
<h1>{{ .Page.Title }}</h1>

{{ .Content }}

<style>
.timeline-container {
    position: relative;
    margin-top: 3rem;
    padding-left: 2.5rem;
}

.timeline-line {
    position: absolute;
    left: 0.5rem;
    top: 0.5rem;
    bottom: 0;
    width: 2px;
    background-color: var(--secondary-color);
    opacity: 0.3;
}

.timeline-item {
    position: relative;
    margin-bottom: 2rem;
    cursor: pointer;
}

.timeline-item:last-child .timeline-line-cover {
    /* Hide the line after the last item if needed */
}

.timeline-marker {
    position: absolute;
    left: -2.32rem; /* Centered on the 0.5rem line */
    top: 0.25rem;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: var(--bg-color);
    border: 2px solid var(--secondary-color);
    transition: all 0.3s ease;
    z-index: 2;
}

.timeline-item:hover .timeline-marker {
    border-color: var(--primary-color);
}

.timeline-item.active .timeline-marker {
    background-color: var(--primary-color);
    border-color: var(--primary-color);
    box-shadow: 0 0 8px var(--primary-color);
}

.timeline-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    transition: color 0.3s ease;
}

.timeline-item:hover .timeline-date {
    color: var(--primary-color);
}

.timeline-date {
    font-weight: bold;
    color: var(--font-color);
    font-size: 1.1rem;
    transition: color 0.3s ease;
}

.timeline-item.active .timeline-date {
    color: var(--primary-color);
}

.timeline-meta {
    font-size: 0.85rem;
    color: var(--secondary-color);
}

.timeline-content {
    display: none;
    margin-top: 0.8rem;
    padding: 1rem 1rem 1rem 1.5rem;
    border-left: 2px dashed var(--primary-color);
    color: var(--font-color);
    line-height: 1.7;
    animation: fadeIn 0.3s ease-in-out;
}

.timeline-item.active .timeline-content {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

<div class="timeline-container">
    <div class="timeline-line"></div>
    {{ range sort .Site.Data.daily "date" "desc" }}
    <div class="timeline-item" onclick="this.classList.toggle('active')">
        <div class="timeline-marker"></div>
        <div class="timeline-header">
            <span class="timeline-date">{{ .date }}</span>
            <span class="timeline-meta">{{ .weekday }} | {{ .weather }}</span>
        </div>
        <div class="timeline-content">
            {{ .content | markdownify }}
        </div>
    </div>
    {{ end }}
</div>

<script>
    // 默认展开第一条碎碎念
    document.addEventListener("DOMContentLoaded", function() {
        const firstItem = document.querySelector(".timeline-item");
        if (firstItem) {
            firstItem.classList.add("active");
        }
    });
</script>
{{ end }}
