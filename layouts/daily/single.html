{{ define "main" }}

<style>
.daily-single-date {
    font-size: 0.95rem;
    color: var(--font-color);
    font-weight: 700;
}

.daily-single-dow {
    font-size: 0.85rem;
    color: var(--secondary-color);
    text-transform: uppercase;
    margin-left: 0.6rem;
}

.daily-single-weather {
    font-size: 1rem;
    margin-left: 0.6rem;
}

.daily-single-sep {
    border: none;
    border-top: 1px solid var(--secondary-color);
    opacity: 0.3;
    margin: 0.5rem 0 1.5rem 0;
    width: 100%;
}

.daily-single-content {
    line-height: 1.8;
}

.daily-single-content p {
    margin: 0;
}
</style>

<article>
    <div>
        <span class="daily-single-date">{{ .Date.Format "2006.01.02" }}</span>
        <span class="daily-single-dow">{{ .Date.Format "Mon" }}</span>
        {{ with .Params.weather }}
        <span class="daily-single-weather">{{ . }}</span>
        {{ end }}
    </div>
    <hr class="daily-single-sep"/>
    <div class="daily-single-content">
        {{ .Content }}
    </div>
</article>

{{ end }}
