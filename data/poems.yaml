- slug: "zhe-gu-tian"
  title: "鹧鸪天·代人赋"
  author: "辛弃疾"
  dynasty: "南宋"
  date: "2026-06-23"
  excerpt: "情知已被山遮断，频倚阑干不自由。"
  sections:
    - name: "上阙"
      text: "晚日寒鸦一片愁。柳塘新绿却温柔。若教眼底无离恨，不信人间有白头。"
    - name: "下阙"
      text: "肠已断，泪难收。相思重上小红楼。情知已被山遮断，频倚阑干不自由。"
  interpretation: >-
    落日里寒鸦归巢勾起我一片思愁。只有池塘柳树发出嫩绿的新芽显出温柔。如果不是眼下亲自遭遇离愁别恨的折磨，根本不会相信这世上真会有人伤心白头。
    离肠寸断，泪流难收。怀着相思之情，又一次登上了小红楼。明明知道乱山无数，遮断了远方的天空，可还是不由自主地靠在栏杆上，一直凝望而不能罢休。


- slug: "zui-hua-yin"
  title: "醉花阴·重阳"
  author: "李清照"
  dynasty: "宋（南北宋之交）"
  date: "2026-06-24"
  excerpt: "莫道不销魂，帘卷西风，人比黄花瘦。"
  sections:
    - name: "上阙"
      text: "薄雾浓云愁永昼，瑞脑销金兽。佳节又重阳，玉枕纱厨，半夜凉初透。"
    - name: "下阙"
      text: "东篱把酒黄昏后，有暗香盈袖。莫道不销魂，帘卷西风，人比黄花瘦。"
  interpretation: >-
    薄雾弥漫，云层浓密，日子过得郁闷愁烦，金兽香炉内，龙脑香的烟雾袅袅升起。又到了重阳佳节，独自一人躺在玉枕纱帐之间，感受着夜晚的凉意逐渐侵入身体，直至将全身浸透。
    在东篱边饮酒直到黄昏以后，淡淡的黄菊香气，随着微风，悄然溢满我的双袖。此情此景怎么能不令人伤感呢？秋风乍起，卷帘而入，帘内的人儿因过度思念身形竟比那黄花还要瘦弱。


- slug: "lang-tao-sha"
  title: "浪淘沙·把酒祝东风"
  author: "欧阳修"
  dynasty: "北宋"
  date: "2026-06-24"
  excerpt: "把酒祝东风，且共从容。"
  sections:
    - name: "上阙"
      text: "把酒祝东风，且共从容。垂杨紫陌洛城东。总是当时携手处，游遍芳丛。"
    - name: "下阙"
      text: "聚散苦匆匆，此恨无穷。今年花胜去年红。可惜明年花更好，知与谁同？"
  interpretation: >-
    端起酒杯向东风祈祷，请你再留些时日不要匆匆离去。洛阳城东郊外的小道已是柳枝满垂。大多是我们去年携手同游的地方，我们游遍了姹紫嫣红的花丛。
    为人生短暂的相聚和分别所苦，离别的遗憾久久激荡在我的心田。今年的花红胜过去年，明年的花儿肯定会更加美好，可惜不知那时将和谁一起游览。
