baseURL = "https://www.bdathe.wiki/"
title = "Bdathe"
locale = "zh-cn"
hasCJKLanguage = true

# No theme — every layout lives in layouts/, every style in assets/css.
# The old hugo-theme-console shipped 564K of CSS that is no longer loaded.

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    # emit CSS classes instead of inline styles, so code blocks can follow
    # 晨/昼/暮/夜 like everything else (see assets/css/main.css)
    noClasses = false
    lineNos = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  description = "Bdathe 的个人 wiki —— 随笔、学习笔记，以及诗、音、影的数字花园。"
  ogimage = "og-default.png"
  author = "Bdathe"
  email = "bdathe@outlook.com"
  github = "https://github.com/bdathe-lb"

[[params.nav]]
  name = "文"
  latin = "writing"
  url = "/posts/"

[[params.nav]]
  name = "诗"
  latin = "poems"
  url = "/poems/"

[[params.nav]]
  name = "音"
  latin = "music"
  url = "/music/"

[[params.nav]]
  name = "影"
  latin = "photos"
  url = "/photos/"

[[params.nav]]
