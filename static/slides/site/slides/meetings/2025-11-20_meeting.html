## Part 1. 概述 

-v-

### 背景与目标
为何研究多智能体任务分配？
- 巨大潜力：多智能体系统是实现自动化物流、灾后搜救等大规模协作任务的关键
- 核心挑战：如何在动态、分布式的环境中高效、无冲突地分配任务是一个 NP-hard 难题

我们要做什么？
- 动态性 (Dynamic)：实现智能体在执行任务过程中的持续协商与动态重规划
- 分布式 (Distributed)：构建一个无中心的决策系统，智能体仅依赖局部通信
- 无冲突 (Conflict-Free)：作为首要目标，确保系统运行的绝对安全与稳定

-v-

### 理论基础
本工作是对经典分布式优化算法 PI 算法 的一次动态实现与创新性改进
> Zhao, W., Meng, Q., & Chung, P. W. H. (2016). A Heuristic Distributed Task Allocation Method for Multivehicle Multitask Problems... IEEE Transactions on Cybernetics.

## Part 2. 主要改进

-v-

### 原PI算法：一个三阶段迭代

<p align="center">
<img src=./images/2025-11-20/PI-Algorithm-Three-Phase.png width=500px height=300px>
<p/>

1. 任务纳入 (Inclusion)：基于“边际成本”将有利可图的任务加入自身规划
2. 共识 (Consensus)：与邻居交换信息，更新对全局最优分配的局部认知
3. 任务移除 (Removal)：放弃在共识中被更优邻居“赢得”的任务

-v-
### 改进一：从“静态迭代”到“事件驱动”
- 问题：原算法需要反复迭代以收敛，不适用于持续运动的智能体
- 解决方案：将完整的 PI 迭代过程封装，并由关键事件触发：
  - 事件1: 模拟启动（用于初始分配）
  - 事件2: 通信邻居发生变化（用于动态协商）
- 效果：实现了从静态优化到动态实时决策的转变，大幅提升了效率

-v-
### 改进二：从“模糊竞争”到“明确承诺”
- 问题：动态环境下，多个智能体可能在通信前都认为自己最优，并同时出发，导致冲突

<p align="center">
<img src=./images/2025-11-20/Conflict_Between_of_Agents.png width=800px height=150px>
<p/>

- 改进方案：引入**“物理承诺”硬锁定机制**
  - 承诺：智能体从 IDLE 切换至 MOVING 状态，即视为做出物理承诺
  - 宣告：在做出承诺的瞬间，广播一个代表“已锁定”的极低成本信号
- 效果：其他智能体收到该信号后会主动放弃竞争，从根源上杜绝了冲突

## Part 3. 系统执行流程

-v-

### 智能体的“感知-决策-行动”循环

1. 感知 & 决策
   - 检查通信事件，触发 PI 算法迭代，动态更新任务计划
2. 计划同步
   - 将决策大脑的最新计划安全地同步给行动单元，并重置状态以应对变化
3. 行动
   - 做出承诺：`IDLE` $\to$ `MOVING` 时，执行“宣告与锁定”
   - 安全检查：行动前再次确认任务归属，防止执行无效计划
   - 物理执行：根据状态机移动、执行任务、完成任务

## Part 4. 结论与展望

-v-

### 工作总结

1. 成功实现了一个动态、分布式、无冲突的多智能体任务分配系统。
2. 通过事件驱动和物理承诺机制，对原 PI 算法进行了关键的创新性改进。
3. 系统兼具灵活性（动态协商）和稳定性（无冲突保证），为实际应用奠定了基础。
